[package]
name = "hardcover-desktop"
version = "0.7.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Runs on a sample library instead of your account: for screenshots and
# trying the app without signing in. See the README.
demo = ["hardcover-core/demo"]

[dependencies]
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fast_image_resize = "6"
gpui-kit = "0.10"
hardcover-core = { path = "../hardcover-core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "qoi"] }
# The bounds for what the library cache keeps beside the library
# (`resource::saved`); the core does the encoding. Already in the tree.
serde = "1"
# Already in the tree through GPUI's text system: right-to-left text is laid
# out by the bidirectional algorithm (`bidi.rs`), with mirrored brackets.
unicode-bidi = "0.3"
unicode-bidi-mirroring = "0.4"
# `ui_scale`: GPUI's Wayland display is a v5 uuid of the output's name.
# Already in the tree.
uuid = { version = "1", features = ["v5"] }

# Search folds letter forms, digits and accents (`text.rs`); text is cut by
# grapheme cluster, so an emoji sequence stays whole (`bidi.rs`).
unicode-normalization = "0.1"
unicode-segmentation = "1"

# `ui_scale` reads the outputs' sizes in mm over a connection of its own:
# GPUI drops them. Both already in the tree through GPUI.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[dev-dependencies]
# GPUI's test support, for the shared components' tests (`ui/`). Turned on in
# the crates themselves: gpui-kit's own `test-support` feature names the
# optional GPUI Fast backend, which then can't be resolved beside this one.
gpui-base = { version = "0.10", features = ["test-support"] }
gpui-component = { version = "0.10", features = ["test-support"] }
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
# Reads the demo catalogue in the genre icon test (`chip::genre`).
serde_json = "1"
# The demo client, for the library model's sync tests.
hardcover-core = { path = "../hardcover-core", features = ["demo"] }
tempfile = "3"
