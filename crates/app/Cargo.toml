[package]
name = "hardcover-desktop"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Runs on a sample library instead of your account: for screenshots and
# trying the app without signing in. See the README.
demo = ["hardcover-core/demo"]

[dependencies]
async-channel = "2"
async-lock = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fast_image_resize = "6"
gpui-kit = "0.10"
hardcover-core = { path = "../hardcover-core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "qoi"] }
# Already in the tree through GPUI's text system; finds right-to-left text.
unicode-bidi = "0.3"

[dev-dependencies]
tempfile = "3"
