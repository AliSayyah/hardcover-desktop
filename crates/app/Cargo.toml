[package]
name = "hardcover-desktop"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-channel = "2"
async-lock = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fast_image_resize = "6"
gpui-kit = "0.10"
hardcover-core = { path = "../hardcover-core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
tempfile = "3"
