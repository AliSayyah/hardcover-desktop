name: Release

# Push a tag such as v0.2.0 to publish a GitHub release. Before tagging, bump
# the version in crates/app/Cargo.toml and add a <release> to the metainfo.
# Run it by hand to build the tarball as a workflow artifact without releasing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build x86_64 tarball
    runs-on: ubuntu-24.04
    # Building on the oldest supported Ubuntu keeps the glibc floor at 2.35.
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version matches the tag
        if: github.ref_type == 'tag'
        run: ci/check-version.sh "$GITHUB_REF_NAME"

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: dist

      - run: cargo build --profile dist --locked -p hardcover-desktop

      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/app/Cargo.toml | head -n1)
          packaging/linux/package.sh "$version" target/dist/hardcover-desktop dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Hardcover Desktop ${TAG#v}" \
            --notes-file packaging/linux/release-notes.md \
            --generate-notes \
            "${prerelease[@]}"
