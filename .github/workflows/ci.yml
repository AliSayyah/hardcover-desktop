name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Weekly, so new RustSec advisories show up even when nothing is pushed.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # Line tables keep file:line in panics and backtraces; full debug info only
  # slows compiling and linking and bloats the cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Every job has a time limit, a few times its usual length (more for a cold
# cache): a network wait that hangs would otherwise hold it for GitHub's six
# hours, and `just release`, which waits for CI, with it. apt's own waits are
# bounded in ci/apt-get.sh.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  # Clippy and the tests build different artifacts (metadata versus code), so
  # they run as parallel jobs, each with its own cache.
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The oldest Ubuntu the release supports, so CI builds what the release builds.
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # Live-API tests are #[ignore]d: CI has no Hardcover credentials.
      - run: cargo test --workspace --locked

  deny:
    name: Dependencies (${{ matrix.checks }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    # A new advisory against an existing dependency shouldn't block unrelated
    # pull requests; it fails the push and weekly runs instead.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    env:
      CARGO_DENY_VERSION: "0.22.0"
      # From the release's own .sha256 file. Update both together.
      CARGO_DENY_SHA256: 98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -sSfLO \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $name.tar.gz" | sha256sum -c -
          tar -xzf "$name.tar.gz"
          echo "$RUNNER_TEMP/$name" >>"$GITHUB_PATH"
      - run: cargo deny --locked check ${{ matrix.checks }}

  packaging:
    name: Desktop entry and metainfo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/apt-get.sh install desktop-file-utils appstream
      - run: desktop-file-validate packaging/linux/*.desktop
      - run: appstreamcli validate --no-net packaging/linux/*.metainfo.xml
      - name: Cargo and metainfo versions agree
        run: ci/check-version.sh

  installer:
    name: Installer and shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh packaging/linux/*.sh ci/*.sh scripts/*.sh
      - name: Test the release script's handling of a flaky network
        run: scripts/release-test.sh
      - name: Test the bounded apt-get
        run: ci/apt-get-test.sh
      # The release workflow tests the installer on the tarball it just
      # signed; this tests the download path, against the latest release.
      - name: Install the latest release
        run: |
          # The one library the binary links that the runner image lacks.
          ci/apt-get.sh install libxkbcommon-x11-0
          home="$RUNNER_TEMP/home"
          # This checkout's installer, through a pipe, as the README's
          # one-liner runs the copy published with the latest release.
          HOME="$home" bash <install.sh
          test -f "$home/.local/share/applications/io.github.alisayyah.HardcoverDesktop.desktop"
          "$home/.local/bin/hardcover-desktop" --version
      - name: Refuse a modified tarball, and one renamed to another version
        run: |
          cd "$RUNNER_TEMP"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern '*.tar.gz.minisig'
          tarball=$(echo hardcover-desktop-*-x86_64-linux.tar.gz)
          refuses() {
            if HOME="$RUNNER_TEMP/home" bash "$GITHUB_WORKSPACE/install.sh" "$1" 2>err; then
              echo "The installer accepted $1" >&2
              exit 1
            fi
            grep -F "$2" err || { cat err >&2; exit 1; }
          }
          mkdir modified renamed
          cp "$tarball" "$tarball.minisig" modified/
          printf x >>"modified/$tarball"
          refuses "modified/$tarball" "Signature verification failed"
          cp "$tarball" renamed/hardcover-desktop-999.0.0-x86_64-linux.tar.gz
          cp "$tarball.minisig" renamed/hardcover-desktop-999.0.0-x86_64-linux.tar.gz.minisig
          refuses renamed/hardcover-desktop-999.0.0-x86_64-linux.tar.gz "the signature names a different release"

  actionlint:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # From the release's checksums.txt. Update both together.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -sSfLO \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color
