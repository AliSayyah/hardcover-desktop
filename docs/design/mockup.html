<!doctype html>
<html lang="en">
<!--
  The reference mockup for the hardcover-design skill (.claude/skills/hardcover-design).
  Open it in a browser. Every screen and both token sheets are built from the CSS variables
  below, which carry the system's token values. When this file and the skill disagree, the
  skill wins; fix this file in the same change. The books come from the demo catalogue
  (plus one Persian title); the reader and their lists are invented. Covers are loaded from
  Hardcover at view time and are never committed. The console prints a contrast and layout audit.
-->
<head>
<meta charset="utf-8">
<title>Hardcover Desktop: design system mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Tokens. Every rule below uses these; the token sheet reads them back
   with getComputedStyle, so the sheet cannot drift from the screens.
   ===================================================================== */
.theme-light {
  --bg: #FAF8F4;            /* paper: the work area */
  --sidebar: #F1EEE7;       /* the sidebar */
  --surface: #F3F0E9;       /* the one inset panel: your progress */
  --raised: #FFFFFF;        /* controls, popovers */
  --hover: rgba(31, 28, 23, .05);     /* ink overlays: they step the same way on every host surface */
  --selected: rgba(31, 28, 23, .10);  /* the current row; a pressed control */
  --border: #E4DED3;
  --border-strong: #918879; /* control outlines: 3:1 on raised, paper, surface, the sidebar */
  --track: #E0D9CC;         /* empty part of a progress bar */
  --switch-thumb: #FFFFFF;  /* raised */
  --chip: rgba(31, 28, 23, .07);
  --skeleton: #E9E4DA;      /* something still loading */
  --fg: #1F1C17;            /* ink */
  --fg-muted: #5F574B;      /* secondary text that carries information: AA on every surface */
  --fg-faint: #7A7266;      /* empty-state icons and other marks; never text */
  --accent: #3B4A9C;        /* ink blue: progress, primary commit, focus, the selected icon, external links */
  --accent-fg: #FFFFFF;
  --accent-soft: rgba(59, 74, 156, .10);
  --ring: rgba(59, 74, 156, .5);
  --gold: #A16207;          /* the user's own rating, nothing else: 3:1 against an empty star */
  --star-empty: rgba(31, 28, 23, .10);
  --scrim: rgba(31, 28, 23, .16); /* the dialog backdrop */
  --danger: #B42318;
  --warning: #B54708;
  --cover-edge: rgba(30, 20, 10, .16);
  --cover-hinge: rgba(30, 20, 10, .16);
  --shadow-cover: 0 1px 2px rgba(40, 28, 16, .18), 0 8px 20px rgba(40, 28, 16, .14);
  --shadow-popover: 0 0 0 1px rgba(30, 20, 10, .10), 0 4px 12px rgba(40, 28, 16, .12);
  --frame-edge: rgba(0, 0, 0, .10);
  color-scheme: light;
}
.theme-dark {
  --bg: #171614;
  --sidebar: #100F0E;
  --surface: #1E1C1A;
  --raised: #262320;
  --hover: rgba(238, 234, 227, .05);
  --selected: rgba(238, 234, 227, .10);
  --border: #292623;
  --border-strong: #77706A;
  --track: #35312C;
  --switch-thumb: #EEEAE3;  /* fg: a raised thumb on track is 1.2:1 here */
  --chip: rgba(238, 234, 227, .08);
  --skeleton: #2B2825;
  --fg: #EEEAE3;
  --fg-muted: #ABA498;
  --fg-faint: #8D877C;
  --accent: #98A5F4;
  --accent-fg: #12142A;
  --accent-soft: rgba(152, 165, 244, .14);
  --ring: rgba(152, 165, 244, .5);
  --gold: #FBBF24;
  --star-empty: rgba(238, 234, 227, .10);
  --scrim: rgba(0, 0, 0, .48);
  --danger: #FB8178;
  --warning: #FDB022;
  --cover-edge: rgba(255, 255, 255, .12);
  --cover-hinge: rgba(0, 0, 0, .28);
  --shadow-cover: 0 1px 2px rgba(0, 0, 0, .55), 0 10px 24px rgba(0, 0, 0, .45);
  --shadow-popover: 0 0 0 1px rgba(255, 255, 255, .08), 0 4px 12px rgba(0, 0, 0, .5);
  --frame-edge: rgba(255, 255, 255, .08);
  color-scheme: dark;
}
:root {
  /* Families. GPUI draws no variable axes, so each is a set of static faces.
     Literata is used at two fixed optical sizes, as two families: Text (12pt)
     up to 18 px and Display (36pt) from 24 px. Nothing depends on letter-spacing. */
  --sans: "Inter", "Vazirmatn", system-ui, sans-serif;
  --serif: "Literata", "Vazirmatn", Georgia, serif;

  /* Type sizes (rem steps: xs, sm, base, lg, xl, 2xl, 3xl) and their line heights */
  --t-12: 12px; --l-12: 16px;
  --t-14: 14px; --l-14: 20px;
  --t-16: 16px; --l-16: 24px;
  --t-18: 18px; --l-18: 24px;
  --t-20: 20px; --l-20: 28px;
  --t-24: 24px; --l-24: 30px;
  --t-30: 30px; --l-30: 36px;
  --l-prose: 26px;          /* serif 16 prose */

  /* Spacing: one scale, named by relationship */
  --s-2: 2px;   /* optical */
  --s-4: 4px;   /* parts of one control */
  --s-6: 6px;   /* chips in a wrapped group; a tag group's label to its chips */
  --s-8: 8px;   /* closely related */
  --s-12: 12px; /* one group */
  --s-16: 16px; /* groups in a section; panel inset */
  --s-24: 24px; /* sections; pane inset */
  --s-32: 32px; /* regions; page inset */

  /* Radius */
  --r-cover-s: 2px;  /* covers xs, sm */
  --r-cover: 3px;    /* covers md and up */
  --r-control: 6px;  /* buttons, inputs, nav rows */
  --r-box: 8px;      /* list rows, panels, popovers */
  --r-pill: 999px;   /* chips, progress bars, the avatar */

  /* Frames */
  --h-control: 32px; --h-control-s: 24px; --h-chip: 20px; --h-row-l: 40px; --h-bar: 56px;
  --w-sidebar: 240px; --w-list: 384px; --w-rail: 272px; --w-key: 96px; --w-key-s: 72px;
  --w-select: 168px; --w-select-s: 128px; --w-meter: 400px; --w-meter-s: 160px; --w-empty: 288px; --w-prose: 640px;
  --icon: 16px; --icon-s: 12px; --icon-l: 24px;
  --meter: 6px; --meter-thin: 2px;   /* progress bars: 6 with words beside them, 2 inside a row */

  /* Covers: always 2:3 */
  --cv-xs: 20px; --cv-sm: 32px; --cv-md: 64px; --cv-lg: 80px; --cv-xl: 128px; --cv-xxl: 160px;
  --cloth-ink: #F4ECDD;
}

/* ---------- Page (outside the mock windows) ---------- */
body { margin: 0; }
.sheet { display: flex; flex-direction: column; gap: 28px; padding: 4px 0 24px; }
.cap { font: 600 13px/1.4 var(--sans); margin: 0 0 8px; }
.cap span { font-weight: 400; opacity: .7; }
.frame { position: relative; overflow: visible; }
.win {
  position: absolute; top: 0; left: 0;
  width: 1200px; display: flex; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font: var(--t-14)/var(--l-14) var(--sans);
  border-radius: 10px;
  box-shadow: 0 0 0 1px var(--frame-edge), 0 18px 40px rgba(0,0,0,.18);
  transform-origin: top left;
  -webkit-font-smoothing: antialiased;
}
.win * { box-sizing: border-box; }

/* ---------- Type roles ---------- */
.serif { font-family: var(--serif); font-optical-sizing: none; font-variation-settings: "opsz" 12; }
.display { font-family: var(--serif); font-optical-sizing: none; font-variation-settings: "opsz" 36; font-weight: 600; font-variant-numeric: lining-nums; }
.d-30 { font-size: var(--t-30); line-height: var(--l-30); }
.d-24 { font-size: var(--t-24); line-height: var(--l-24); }
.title-18 { font: 600 var(--t-18)/var(--l-18) var(--serif); font-optical-sizing: none; font-variation-settings: "opsz" 12; }
.prose { font: 400 var(--t-16)/var(--l-prose) var(--serif); font-optical-sizing: none; font-variation-settings: "opsz" 12; max-width: var(--w-prose); }
.page-title { font-size: var(--t-20); line-height: var(--l-20); font-weight: 600; }
.section { font-size: var(--t-16); line-height: var(--l-16); font-weight: 600; }
.heading { font-size: var(--t-14); line-height: var(--l-14); font-weight: 600; }
.label { font-size: var(--t-12); line-height: var(--l-12); font-weight: 500; color: var(--fg-muted); }
.small { font-size: var(--t-12); line-height: var(--l-12); }
.strong { font-weight: 500; }
.muted { color: var(--fg-muted); }
.ink { color: var(--fg); }
.faint { color: var(--fg-faint); }
.num { font-variant-numeric: tabular-nums; }
/* Right-to-left text: the block sits on the interface's leading edge, the line runs in its own
   direction. A title that wraps fills its column, so its lines pack to the right (WrappingText). */
.rtl { direction: rtl; text-align: start; align-self: flex-start; max-width: 100%; }
.display.rtl { line-height: 1.5; }
.one-line.rtl { align-self: auto; text-align: left; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

svg.i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.xs { width: var(--icon-s); height: var(--icon-s); }

/* ---------- Layout helpers ---------- */
.row-c { display: flex; align-items: center; }
.row-b { display: flex; align-items: baseline; }
.col { display: flex; flex-direction: column; }
.fill { flex: 1; min-width: 0; }
.push { margin-left: auto; }
.g-4 { gap: var(--s-4); } .g-8 { gap: var(--s-8); } .g-12 { gap: var(--s-12); } .g-16 { gap: var(--s-16); } .g-24 { gap: var(--s-24); }
.mt-4 { margin-top: var(--s-4); } .mt-8 { margin-top: var(--s-8); } .mt-12 { margin-top: var(--s-12); } .mt-16 { margin-top: var(--s-16); } .mt-24 { margin-top: var(--s-24); }
.start { align-self: flex-start; }
.hair { height: 1px; background: var(--border); flex: none; }

/* ---------- Sidebar: icons on x=16, labels on x=40, counts on the trailing lane ---------- */
.sb { width: var(--w-sidebar); flex: none; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: var(--s-8); }
.brand { display: flex; align-items: center; gap: var(--s-8); height: var(--h-row-l); padding: 0 var(--s-8); margin-bottom: var(--s-8); font-size: var(--t-16); font-weight: 600; }
.brand svg { color: var(--accent); }
.nav { display: flex; align-items: center; gap: var(--s-8); height: var(--h-control); padding: 0 var(--s-8); border-radius: var(--r-control); white-space: nowrap; flex: none; }
.nav svg { color: var(--fg-muted); }
.nav .lab { overflow: hidden; text-overflow: ellipsis; }
.nav .n { margin-left: auto; padding-left: var(--s-8); font-size: var(--t-12); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.nav.hover, .row.hover, .btn.hover, .menu-item.hover { background-image: linear-gradient(var(--hover), var(--hover)); }
.nav.sel, .row.sel, .btn.pressed { background-image: linear-gradient(var(--selected), var(--selected)); }
.nav.sel { font-weight: 500; }
.nav.sel svg { color: var(--accent); }
.nav.sel .n { color: var(--fg); }
.nav.focus { box-shadow: 0 0 0 2px var(--ring), inset 0 0 0 1px var(--accent); }
.sb .label { padding: var(--s-16) var(--s-8) var(--s-4); }
/* The goal is a row like the others; its bar runs under the label, from the label spine to the count lane. */
.goal-row { display: flex; flex-direction: column; justify-content: center; gap: var(--s-4); height: var(--h-row-l); padding: 0 var(--s-8); border-radius: var(--r-control); }
.goal-row .top { display: flex; align-items: center; gap: var(--s-8); }
.goal-row svg { color: var(--fg-muted); }
.goal-row .n { margin-left: auto; font-size: var(--t-12); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.goal-row .bar { margin-left: calc(var(--icon) + var(--s-8)); }
.acct { margin-top: auto; display: flex; align-items: center; gap: var(--s-8); padding: var(--s-8); border-radius: var(--r-control); }
.avatar { width: var(--h-control); height: var(--h-control); border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: var(--t-12); font-weight: 600; flex: none; }
.acct svg { margin-left: auto; color: var(--fg-muted); }

/* ---------- Controls ---------- */
.btn { height: var(--h-control); padding: 0 var(--s-12); border-radius: var(--r-control); border: 1px solid var(--border-strong); background: var(--raised); color: var(--fg); font: 500 var(--t-14)/1 var(--sans); display: inline-flex; align-items: center; gap: var(--s-8); white-space: nowrap; flex: none; }
.btn svg { color: var(--fg-muted); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); }
.btn.primary svg { color: inherit; }
.btn.danger { background: transparent; color: var(--danger); }
.btn.danger svg { color: inherit; }
.btn.sm { height: var(--h-control-s); padding: 0 var(--s-8); font-size: var(--t-12); gap: var(--s-4); }
.btn.icon { width: var(--h-control); padding: 0; justify-content: center; }
.btn.focus, .input.focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--ring); }
.dis { opacity: .5; }
.input { height: var(--h-control); border: 1px solid var(--border-strong); background: var(--raised); border-radius: var(--r-control); display: flex; align-items: center; gap: var(--s-8); padding: 0 var(--s-8); color: var(--fg-muted); }
.input svg { color: var(--fg-muted); }
.input .val { color: var(--fg); }
.select { height: var(--h-control); border: 1px solid var(--border-strong); background: var(--raised); border-radius: var(--r-control); display: inline-flex; align-items: center; gap: var(--s-8); padding: 0 var(--s-8) 0 var(--s-12); flex: none; }
.select svg { margin-left: auto; color: var(--fg-muted); }
.select.sm { height: var(--h-control-s); padding: 0 var(--s-4) 0 var(--s-8); font-size: var(--t-12); width: var(--w-select-s); }
.switch { width: 28px; height: 16px; border-radius: var(--r-pill); background: var(--track); position: relative; flex: none; }
.switch i { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: var(--r-pill); background: var(--switch-thumb); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--accent); }
.switch.on i { left: 14px; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.textbtn { border-bottom: 1px solid transparent; }
.textbtn.hover { border-bottom-color: currentColor; }

.bar { height: var(--meter); border-radius: var(--r-pill); background: var(--track); position: relative; }
.bar > i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: inherit; background: var(--accent); }
.bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--fg); } /* where the pace says you should be */
.bar.thin { height: var(--meter-thin); }

.chip { display: inline-flex; align-items: center; gap: var(--s-4); height: var(--h-chip); padding: 0 var(--s-8); border-radius: var(--r-pill); background: var(--chip); color: var(--fg-muted); font-size: var(--t-12); font-weight: 500; white-space: nowrap; flex: none; }
.chip svg.warn { color: var(--warning); }
.chip svg.genre { color: var(--accent); }
/* Wrapped chips sit 6 apart both ways; the Tags block's groups 16 apart,
   each label 6 above its chips. */
.tag-row { display: flex; flex-wrap: wrap; gap: var(--s-6); }
.tag-groups { display: flex; flex-direction: column; gap: var(--s-16); }
.tag-groups .label { margin-bottom: var(--s-6); }

.stars { display: inline-flex; gap: var(--s-2); align-items: center; flex: none; }
.star { position: relative; width: 16px; height: 16px; }
.star svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.star .sfill { position: absolute; inset: 0; overflow: hidden; }
.stars.lg .star { width: 20px; height: 20px; }
.stars.xs .star { width: 12px; height: 12px; }

.panel { background: var(--surface); border-radius: var(--r-box); padding: var(--s-16); }
.popover { background: var(--raised); border-radius: var(--r-box); box-shadow: var(--shadow-popover); padding: var(--s-4); }
.menu-item { display: flex; align-items: center; gap: var(--s-8); height: var(--h-control); padding: 0 var(--s-8); border-radius: var(--r-control); }
.menu-item svg { color: var(--fg-muted); }

/* ---------- Covers ----------
   2:3 always. A hairline edge at every size. From md up: a hinge (one 2-stop gradient strip on the
   spine side) and, where the cover is the subject of its row, the cover shadow. */
.cover { position: relative; flex: none; width: var(--w); height: calc(var(--w) * 1.5); border-radius: var(--r-cover); overflow: hidden; background: var(--cloth, var(--skeleton)); color: var(--cloth-ink); }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover .edge { position: absolute; inset: 0; border: 1px solid var(--cover-edge); border-radius: inherit; }
.cover .hinge { position: absolute; top: 0; bottom: 0; left: 0; width: 6%; background: linear-gradient(90deg, var(--cover-hinge), transparent); }
.cover.lift { box-shadow: var(--shadow-cover); }
.cv-xs { --w: var(--cv-xs); --ph: 10px; border-radius: var(--r-cover-s); }
.cv-sm { --w: var(--cv-sm); --ph: 16px; border-radius: var(--r-cover-s); }
.cv-md { --w: var(--cv-md); --ph: 9px; }
.cv-lg { --w: var(--cv-lg); --ph: 11px; }
.cv-xl { --w: var(--cv-xl); --ph: 18px; }
.cv-xxl { --w: var(--cv-xxl); --ph: 22px; }
/* The cloth cover: a blind-stamped frame, the title, a short rule, the author. Its type scales with
   the cover (it stands in for an image), so it is the one place off the type scale. */
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 16% 13% 13%; font-family: var(--serif); font-optical-sizing: none; font-variation-settings: "opsz" 12; font-size: var(--ph); }
.ph .stamp { position: absolute; inset: 5%; border: 1px solid currentColor; border-radius: 1px; opacity: .28; }
.ph .pt { font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.ph .rule { width: 24%; height: 1px; background: currentColor; opacity: .6; margin-top: 10%; flex: none; }
.ph .pa { margin-top: auto; opacity: .85; line-height: 1.2; font-size: .8em; }
.ph[dir="rtl"] .pt { line-height: 1.5; }
.ph.initial { justify-content: center; padding: 0; font-weight: 600; line-height: 1; gap: 3px; }
.ph.initial .rule { margin: 0; width: 8px; }
.cv-xs .ph.initial .rule { width: 6px; }
.cover.loading { background: var(--skeleton); }
.sk { background: var(--skeleton); border-radius: var(--r-control); height: 12px; }

/* ---------- Shared regions ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow: hidden; }
.objbar { height: var(--h-bar); flex: none; display: flex; align-items: center; gap: var(--s-4); padding: 0 var(--s-16); }
.objbar.line { border-bottom: 1px solid var(--border); padding: 0 var(--s-24) 0 var(--s-32); }
.objbar .back { margin-left: calc(-1 * var(--s-12)); }
.rail { width: var(--w-rail); flex: none; display: flex; flex-direction: column; padding-left: var(--s-24); border-left: 1px solid var(--border); }
.rail .hair { margin: var(--s-24) 0; }
.figure { display: flex; align-items: baseline; gap: var(--s-8); margin-top: var(--s-4); }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--s-4); padding: var(--s-32); }
.empty svg { width: var(--icon-l); height: var(--icon-l); color: var(--fg-faint); margin-bottom: var(--s-8); stroke-width: 1.5; }
.empty .d { color: var(--fg-muted); max-width: var(--w-empty); }
.empty .btn { margin-top: var(--s-12); }

/* ---------- Home ---------- */
.home { padding: var(--s-32); }
.cols { display: flex; gap: var(--s-32); align-items: stretch; }
.hero { display: flex; gap: var(--s-24); padding: var(--s-4) 0 var(--s-24); }
.hero-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hero .prog { margin-top: auto; display: flex; flex-direction: column; gap: var(--s-8); max-width: var(--w-meter); }
.cr { display: flex; align-items: center; gap: var(--s-16); padding: var(--s-16) 0; border-top: 1px solid var(--border); }
.cr .progline { display: flex; align-items: center; gap: var(--s-8); margin-top: var(--s-8); }
.cr .progline .bar { width: var(--w-meter-s); }
.cr .acts { display: flex; flex-direction: column; align-items: flex-end; gap: var(--s-4); }
.shelf { display: flex; gap: var(--s-16); }
.shelf .it { width: var(--cv-md); }
.shelf.lg .it { width: var(--cv-lg); }
.shelf .tt { font-size: var(--t-12); line-height: var(--l-12); margin-top: var(--s-8); }
/* A read-only sequence (Coming soon, reviews): rows separated by hairlines, no hover fill. */
.seq-row { display: flex; align-items: center; gap: var(--s-12); padding: var(--s-12) 0; border-top: 1px solid var(--border); }
.seq-row:first-child { border-top: 0; }
.seq-row .when { flex: none; display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.seq-row .lane { width: 136px; flex: none; display: flex; justify-content: flex-end; }
.group-label { padding-top: var(--s-24); padding-bottom: var(--s-4); }

const GENRE_ICON = { "Science Fiction": "rocket", "Space": "orbit", "Adventure": "compass", "Fantasy": "wand", "High Fantasy": "wand", "Epic Fantasy": "wand", "Literary Fiction": "bookmarked", "Classics": "landmark", "Mystery": "search", "Magical Realism": "sparkles" };
const genreChip = g => `<span class="chip">${GENRE_ICON[g] ? ic(GENRE_ICON[g], "xs genre") : ""}${g}</span>`;
const tagChip = t => `<span class="chip">${t}</span>`;
const warnChip = t => `<span class="chip">${ic("warn", "xs warn")}${t}</span>`;
// The Tags block: each group's label above its chips, which wrap across the
// block. Genres show here only past the header's first six.
const tagsBlock = (groups, more) => `<div class="block">${blockH("Tags", more ? `<span class="btn sm ghost">Show ${more} more</span>` : "")}<div class="tag-groups">${groups.map(([label, chips]) => `<div><div class="label">${label}</div><div class="tag-row">${chips.join("")}</div></div>`).join("")}</div></div>`;
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><polygon points="12 2.6 14.85 8.55 21.4 9.35 16.6 13.85 17.85 20.35 12 17.15 6.15 20.35 7.4 13.85 2.6 9.35 9.15 8.55"/></svg>';
// The hover preview: the same star as a ring, in gold over the empty star, so it differs from a saved rating by shape.
const STAR_OUTLINE = STAR.replace('fill="currentColor"', 'fill="none"');
// own: gold; cat: the muted text colour (catalogue figures); preview: gold outlines (the pointer over the rating control)
function stars(v, kind = "own", size = "") {
  const col = kind === "cat" ? "var(--fg-muted)" : "var(--gold)";
  const glyph = kind === "preview" ? STAR_OUTLINE : STAR;
  const px = size === "lg" ? 20 : size === "xs" ? 12 : 16;
  let h = `<span class="stars ${size}">`;
  for (let i = 0; i < 5; i++) {
    const f = Math.max(0, Math.min(1, v - i));
    h += `<span class="star"><span style="color:var(--star-empty)">${STAR}</span>` +
      (f > 0 ? `<span class="sfill" style="width:${f * 100}%;color:${col}"><span style="display:block;width:${px}px;height:100%;position:relative">${glyph}</span></span>` : "") + `</span>`;
  }
  return h + "</span>";
}
const star1 = (kind = "cat") => `<span class="stars xs"><span class="star" style="color:${kind === "own" ? "var(--gold)" : "var(--fg-muted)"}">${STAR}</span></span>`;

// ---------- Covers: the image when it loads, a cloth cover when the book has none ----------
// Eight book-cloth colours, the same in both themes; the title picks one.
const CLOTH = ["#6A4A39", "#3A574B", "#414C6B", "#743838", "#7A5D30", "#39596A", "#594567", "#4E5356"];
const hash = s => [...s].reduce((h, ch) => (h * 31 + ch.codePointAt(0)) >>> 0, 7);
function cover(b, size, lift = false, state = "") {
  const small = size === "xs" || size === "sm";
  const over = `${small ? "" : '<div class="hinge"></div>'}<div class="edge"></div>`;
  if (state === "loading") return `<div class="cover cv-${size} loading"><div class="edge"></div></div>`;
  const cloth = CLOTH[hash(b.t) % CLOTH.length];
  const dir = b.rtl ? ' dir="rtl"' : "";
  const ph = small
    ? `<div class="ph initial"${dir}><span>${[...b.t.replace(/^(The|Untitled) /, "")][0]}</span>${size === "sm" ? '<div class="rule"></div>' : ""}</div>`
    : `<div class="ph"${dir}><div class="stamp"></div><div class="pt">${b.t}</div><div class="rule"></div>${size === "md" ? "" : `<div class="pa">${b.a}</div>`}</div>`;
  return `<div class="cover cv-${size}${lift ? " lift" : ""}" style="--cloth:${cloth}">${ph}${b.c ? `<img src="${b.c}" alt="" onerror="this.remove()">` : ""}${over}</div>`;
}

function statsWide(wide = true) {
  const fig = (v, l) => `<div><div class="display d-30 num">${v}</div><div class="muted">${l}</div></div>`;
  const bars = (data, cls = "") => {
    const max = Math.max(...data.map(([, n]) => n));
    return `<div class="chart ${cls}">${data.map(([, n]) => `<div class="b">${n ? `<span class="num">${n.toLocaleString("en")}</span><i style="height:${Math.round(n / max * 80)}%"></i>` : ""}</div>`).join("")}</div>
      <div class="chart-x">${data.map(([k]) => `<span>${k}</span>`).join("")}</div>`;
  };
  const years = [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];

const probes = {};
for (const t of ["light", "dark"]) { const p = document.createElement("div"); p.className = "theme-" + t; p.style.display = "none"; document.body.append(p); probes[t] = p; }
const tv = (theme, name) => getComputedStyle(probes[theme]).getPropertyValue(name).trim();
const rv = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const lum = hex => { const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
const HOSTS = ["--bg", "--sidebar", "--surface", "--raised"];
const hex2 = n => Math.round(n).toString(16).padStart(2, "0");
// An overlay token (rgba) laid on a host surface, as a hex colour.
function over(theme, top, host) {
  const m = tv(theme, top).match(/[\d.]+/g).map(Number), b = tv(theme, host);
  return "#" + [0, 1, 2].map(i => hex2(m[i] * m[3] + parseInt(b.slice(1 + 2 * i, 3 + 2 * i), 16) * (1 - m[3]))).join("");
}
// Every fill text can sit on: each host, alone and under hover and selected.
const fills = theme => HOSTS.flatMap(h => [tv(theme, h), over(theme, "--hover", h), over(theme, "--selected", h)]);
// A chip on each host: accent carries a genre's icon there.
const chips = theme => HOSTS.map(h => over(theme, "--chip", h));
const worst = (theme, fg, on) => Math.min(...(on || fills(theme)).map(s => contrast(tv(theme, fg), s)));
const plain = (theme, ...names) => names.map(n => tv(theme, n));

    const papers = [tv(t, "--bg"), over(t, "--hover", "--bg"), over(t, "--selected", "--bg")];
    const empty = papers.map(p => { const m = tv(t, "--star-empty").match(/[\d.]+/g).map(Number); return "#" + [0, 1, 2].map(i => hex2(m[i] * m[3] + parseInt(p.slice(1 + 2 * i, 3 + 2 * i), 16) * (1 - m[3]))).join(""); });
    console.log(`marks ${t}: border-strong ${outline.toFixed(2)}, gold on an empty star ${worst(t, "--gold", empty).toFixed(2)}`);
    // State fills must step the same way on every host: rest < hover < selected in distance from the host.
    const steps = HOSTS.map(h => { const [r, hv, s] = [tv(t, h), over(t, "--hover", h), over(t, "--selected", h)].map(lum); return `${h.slice(2)} ${Math.sign(hv - r) === Math.sign(s - hv) ? "ok" : "FLIPS"} (${contrast(tv(t, h), over(t, "--hover", h)).toFixed(2)}, ${contrast(tv(t, h), over(t, "--selected", h)).toFixed(2)})`; });
    console.log(`state steps ${t}: ${steps.join(", ")}`);
  }
  console.log("cloth ink on cloth:", CLOTH.map(c => contrast(rv("--cloth-ink"), c).toFixed(1)).join(" "));
  const clipped = [];
  document.querySelectorAll(".win").forEach(w => {
    w.querySelectorAll(".sb, .main, .scroll, .list, .detail, .pane, .tok, .rail, .fill, .bh-info, .actbar, .objbar, .cr, .row, .hero").forEach(el => {
      if (el.classList.contains("one-line")) return;
      if (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) clipped.push(`${w.dataset.name}: .${el.className.split(" ").join(".")} ${el.scrollWidth}x${el.scrollHeight} in ${el.clientWidth}x${el.clientHeight}`);
    });
    const bottom = Math.max(...[...w.querySelectorAll("*")].filter(e => !e.children.length && !e.closest(".sb") && !e.classList.contains("hair")).map(e => e.getBoundingClientRect().bottom)) - w.getBoundingClientRect().top;
    const scale = w.getBoundingClientRect().width / w.clientWidth;
    console.log(`window ${w.dataset.name}: content ends at ${Math.round(bottom / scale)} of ${w.clientHeight}`);
  });
  console.log(clipped.length ? "CLIPPED\n" + clipped.join("\n") : "no clipped regions");
});
</script>
